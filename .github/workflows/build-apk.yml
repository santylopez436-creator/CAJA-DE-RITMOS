
name: Build SR16 Ritmos APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SR16_Android_APK_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o SR16_Android_APK_Project.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p SR16_Android_APK_Project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SR16-Ritmos-APK
          path: SR16_Android_APK_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
